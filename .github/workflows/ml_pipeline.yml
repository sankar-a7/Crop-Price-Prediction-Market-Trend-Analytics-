name: End-to-End ML Forecasting CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate Historical Market Dataset
      run: |
        python generate_dataset.py

    - name: Execute Pipeline Unit Tests
      run: |
        python -m unittest discover -s tests -p "test_*.py"

    - name: Train & Benchmark ML Regression Architectures
      run: |
        python train.py

    - name: Verify Trend Accuracy Assertion
      run: |
        python -c "
        import json
        with open('models/benchmark_results.json') as f:
            data = json.load(f)
        acc = data.get('regional_average_trend_accuracy', 0)
        print(f'Regional Trend Accuracy: {acc}%')
        assert acc >= 90.0, f'Trend accuracy {acc}% is below required 90.0% threshold'
        "
